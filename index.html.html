<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIENVENIDO A CA&A</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>

        /* --- 1. FONDO AZUL REY Y DORADO --- */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            /* Degradado elegante de Azul Rey a Dorado */
            background: linear-gradient(135deg, #002B7A 20%, #004182 50%, #d4af37 100%);
            background-attachment: fixed;
            font-family: 'Poppins', sans-serif;
        }

        /* --- 2. TÍTULO BLANCO CON NUEVA LETRA --- */
        h1 {
            color: #ffffff; /* Blanco puro */
            font-family: 'Montserrat', sans-serif; /* Letra más gruesa y moderna */
            font-size: 4rem;
            text-transform: uppercase;
            letter-spacing: 8px;
            margin-bottom: 50px;
            text-align: center;
            /* Sombra suave para que resalte del fondo */
            text-shadow: 3px 3px 15px rgba(0,0,0,0.3);
            
            /* Animación suave de entrada */
            animation: aparecer 1.5s ease-out;
        }
    
        /*---FRASE DE LA PAGINA---*/
         P {
            color: #ffffff; /* Blanco puro */
            font-family: 'Montserrat', sans-serif; /* Letra más gruesa y moderna */
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 8px;
            margin-bottom: 50px;
            text-align: center;
            /* Sombra suave para que resalte del fondo */
            text-shadow: 3px 3px 15px rgba(0,0,0,0.3);
            
            /* Animación suave de entrada */
            animation: aparecer 1.5s ease-out;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* --- 3. CONTENEDOR DE BOTONES --- */
        .menu-container {
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap;
            width: 90%;
        }

        .boton-imagen {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 280px;
            height: 180px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 22px;
            border-radius: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3); /* Borde blanco sutil */
            
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
            
            /* LA ANIMACIÓN DE SALTO QUE TE GUSTÓ */
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            animation: aparecer 1.5s ease-out;
        }

        /* Oscurecemos un poco la imagen para que el texto resalte */
        .boton-imagen::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.3);
            transition: background 0.3s;
            z-index: 1;
        }

        .boton-imagen span {
            position: relative;
            z-index: 2;
        }

        /* EFECTO HOVER */
        .boton-imagen:hover {
            transform: translateY(-15px); /* El salto que querías */
            box-shadow: 0 20px 35px rgba(0,0,0,0.4);
            border-color: #ffffff; /* El borde se ilumina a blanco total */
        }

        .boton-imagen:hover::before {
            background: rgba(0, 0, 0, 0.1); /* Se aclara la imagen al pasar el mouse */
        }
